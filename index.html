<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Que tipo de trader é você? · BitVisionário</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0E1420;        /* base */
    --surface:#161E2E;    /* card */
    --surface-2:#1D2739;  /* raised */
    --line:#26324A;
    --gold:#E8B84B;       /* signal / accent */
    --gold-dim:#B78F2E;
    --mint:#4FD1A5;       /* progress / positive */
    --hi:#F2F5FA;
    --mid:#9AA7BD;
    --low:#657390;
    --radius:14px;
    --maxw:560px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #17233a 0%, var(--ink) 55%) fixed;
    color:var(--hi);
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.55;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 18px;
    -webkit-font-smoothing:antialiased;
  }
  .stage{width:100%;max-width:var(--maxw)}

  /* header / progress sparkline */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:14px}
  .brand{font-family:"Space Grotesk";font-weight:700;letter-spacing:.02em;font-size:15px;color:var(--hi)}
  .brand span{color:var(--gold)}
  .spark{flex:1;max-width:170px}
  .spark svg{display:block;width:100%;height:34px;overflow:visible}
  .spark .track{stroke:var(--line);stroke-width:2;fill:none}
  .spark .line{stroke:var(--gold);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1000;stroke-dashoffset:var(--dash,1000);transition:stroke-dashoffset .5s ease}
  .spark .dot{fill:var(--ink);stroke:var(--gold);stroke-width:2}
  .spark .dot.on{fill:var(--gold)}
  .steplabel{font-size:12px;color:var(--low);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* card */
  .card{
    background:linear-gradient(180deg, var(--surface) 0%, #131b29 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 26px 26px;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.8);
  }
  .fade{animation:fade .32s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h1{font-family:"Space Grotesk";font-weight:700;font-size:clamp(24px,5.5vw,32px);line-height:1.12;letter-spacing:-.01em}
  h2{font-family:"Space Grotesk";font-weight:600;font-size:clamp(19px,4.6vw,23px);line-height:1.2;letter-spacing:-.01em}
  .lead{color:var(--mid);font-size:15.5px;margin-top:12px}
  .qmeta{color:var(--gold);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:10px;font-family:"Space Grotesk"}

  /* options */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .opt{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
    padding:14px 15px;color:var(--hi);font-size:15px;font-family:inherit;
    transition:border-color .15s, background .15s, transform .05s;
  }
  .opt:hover{border-color:var(--gold-dim);background:#212c40}
  .opt:active{transform:scale(.995)}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .opt .k{
    flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    background:var(--ink);border:1px solid var(--line);color:var(--mid);
    font-family:"Space Grotesk";font-weight:600;font-size:13px;
  }
  .opt:hover .k{color:var(--gold);border-color:var(--gold-dim)}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--gold);color:#1a1406;border:none;border-radius:11px;
    padding:15px 20px;font-family:"Space Grotesk";font-weight:600;font-size:16px;cursor:pointer;
    transition:filter .15s, transform .05s;text-decoration:none;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--mid);border:1px solid var(--line);margin-top:10px}
  .btn.ghost:hover{color:var(--hi);border-color:var(--gold-dim);filter:none}

  .back{background:none;border:none;color:var(--low);font-family:inherit;font-size:13px;cursor:pointer;margin-top:16px;padding:4px 0}
  .back:hover{color:var(--mid)}

  /* form */
  .field{margin-top:16px}
  .field label{display:block;font-size:13px;color:var(--mid);margin-bottom:7px;font-weight:500}
  .field input{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:14px 15px;color:var(--hi);font-family:inherit;font-size:15.5px;
  }
  .field input:focus{outline:none;border-color:var(--gold)}
  .field input::placeholder{color:var(--low)}
  .err{color:#f0846b;font-size:12.5px;margin-top:6px;min-height:16px}
  .consent{color:var(--low);font-size:11.5px;margin-top:14px;text-align:center;line-height:1.5}

  /* result */
  .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(232,184,75,.1);
    border:1px solid var(--gold-dim);color:var(--gold);border-radius:999px;
    padding:6px 13px;font-size:12.5px;font-weight:600;font-family:"Space Grotesk";margin-bottom:16px}
  .result-body{color:var(--mid);font-size:15.5px;margin-top:12px}
  .traits{list-style:none;margin:20px 0 4px;display:flex;flex-direction:column;gap:10px}
  .traits li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:var(--hi)}
  .traits .tick{flex:none;color:var(--mint);margin-top:1px}
  .divider{height:1px;background:var(--line);margin:24px 0}

  .spin{width:18px;height:18px;border:2px solid rgba(26,20,6,.35);border-top-color:#1a1406;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion: reduce){
    .fade{animation:none}
    .spark .line{transition:none}
    .spin{animation-duration:2s}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand">Bit<span>Visionário</span></div>
    <div class="spark" aria-hidden="true">
      <svg viewBox="0 0 170 34" preserveAspectRatio="none">
        <polyline class="track" id="sparkTrack" points=""></polyline>
        <polyline class="line" id="sparkLine" points=""></polyline>
        <g id="sparkDots"></g>
      </svg>
    </div>
    <div class="steplabel" id="stepLabel"></div>
  </div>
  <div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIG — preencha estas linhas e a página está pronta
   ============================================================ */
const CONFIG = {
  // Destino final do lead: página de venda (Systeme.io)
  salesUrl: "https://bitvisionario.systeme.io/bitvisionario",

  // Supabase (opcional — se vazio, o quiz ainda funciona e dispara o Pixel)
  supabaseUrl:      "https://nlksbeumvzumshpftfmw.supabase.co",
  supabaseAnonKey:  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sa3NiZXVtdnp1bXNocGZ0Zm13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDk1MTQsImV4cCI6MjEwNDM4NTUxNH0.NIJURebOkDopyezRGaQdrmt1BM5J8PADtPD2Qnecxb0",
  supabaseTable:    "leads_quiz",

  // Webhook alternativo/adicional (opcional) — recebe o mesmo payload via POST
  webhookUrl:       "",

  // Meta Pixel: coloque o ID aqui OU deixe o <script> do Pixel no <head> da sua LP.
  // Se preencher, o Pixel é inicializado automaticamente.
  pixelId:          "1045644431695133"
};

/* ---- Perguntas. weight = peso no cálculo do perfil. level 1..4 ---- */
const QUESTIONS = [
  { id:"experiencia", weight:2,
    q:"Qual é a sua experiência no mercado hoje?",
    opts:[
      {k:"A", t:"Nunca operei, só tenho curiosidade", level:1},
      {k:"B", t:"Já fiz algumas operações por conta", level:2},
      {k:"C", t:"Opero com frequência", level:3},
      {k:"D", t:"Opero de forma consistente", level:4},
    ]},
  { id:"analise", weight:1,
    q:"Como está o seu conhecimento de análise gráfica?",
    opts:[
      {k:"A", t:"Do zero", level:1},
      {k:"B", t:"Básico", level:2},
      {k:"C", t:"Intermediário — uso indicadores", level:3},
      {k:"D", t:"Avançado", level:4},
    ]},
  { id:"tempo", weight:1,
    q:"Quanto tempo por dia você consegue dedicar?",
    opts:[
      {k:"A", t:"Menos de 30 minutos", level:1},
      {k:"B", t:"Entre 30 min e 1 hora", level:2},
      {k:"C", t:"De 1 a 3 horas", level:3},
      {k:"D", t:"Mais de 3 horas", level:4},
    ]},
  { id:"dor", weight:2,
    q:"O que mais te trava hoje?",
    opts:[
      {k:"A", t:"Não sei por onde começar", level:1},
      {k:"B", t:"Opero, mas fico no zero a zero", level:2},
      {k:"C", t:"Falta disciplina e gestão de risco", level:3},
      {k:"D", t:"Falta uma comunidade pra evoluir", level:4},
    ]},
  { id:"objetivo", weight:1,
    q:"Qual é o seu principal objetivo?",
    opts:[
      {k:"A", t:"Aprender do zero com segurança", level:1},
      {k:"B", t:"Ter uma renda extra", level:2},
      {k:"C", t:"Viver do trading", level:4},
      {k:"D", t:"Melhorar os meus resultados atuais", level:3},
    ]},
  { id:"compromisso", weight:1,
    q:"Quão comprometido você está em evoluir nos próximos 3 meses?",
    opts:[
      {k:"A", t:"Só pesquisando por enquanto", level:1},
      {k:"B", t:"Quero começar", level:2},
      {k:"C", t:"Comprometido, é prioridade", level:3},
      {k:"D", t:"Total — faço o que for preciso", level:4},
    ]},
];

/* ---- Perfis de resultado ---- */
const PROFILES = {
  iniciante:{
    key:"iniciante",
    badge:"Iniciante Estratégico",
    title:"Você tem o perfil certo pra começar do jeito certo",
    body:"O maior erro de quem começa é se jogar sozinho e queimar capital aprendendo por tentativa e erro. Você ainda não caiu nessa — e é aí que está a sua vantagem.",
    traits:[
      "Aprende o fundamento antes de arriscar",
      "Constrói disciplina desde o primeiro trade",
      "Evolui junto de quem já trilhou o caminho",
    ],
    cta:"Quero começar do jeito certo",
  },
  inconsistente:{
    key:"inconsistente",
    badge:"Trader Inconsistente",
    title:"Seu problema não é conhecimento — é método",
    body:"Você já entende o mercado, mas fica no vai e volta. Isso quase nunca é falta de estudo: é falta de um processo claro e de gestão de risco. É exatamente o ponto que a comunidade destrava.",
    traits:[
      "Processo de operação claro e repetível",
      "Gestão de risco que protege o resultado",
      "Acompanhamento pra sustentar a consistência",
    ],
    cta:"Quero ganhar consistência",
  },
  evolucao:{
    key:"evolucao",
    badge:"Trader em Evolução",
    title:"Você já opera — falta o ambiente certo",
    body:"Nesse ponto o que separa quem estaciona de quem evolui não é mais técnica isolada: é análise diária e estar cercado de gente que leva a sério. É o que você encontra na comunidade.",
    traits:[
      "Análise diária pra afiar as decisões",
      "Networking com traders de verdade",
      "Ambiente que empurra o seu nível pra cima",
    ],
    cta:"Quero subir de nível",
  },
};

/* ============================================================
   Estado + utilitários
   ============================================================ */
const app = document.getElementById("app");
const state = { step:-1, answers:{} }; // -1 = intro
const TOTAL = QUESTIONS.length;

// UTMs + referências da URL
function collectUtms(){
  const p = new URLSearchParams(location.search);
  const keys = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","gclid"];
  const out = {};
  keys.forEach(k => { const v = p.get(k); if(v) out[k]=v; });
  return out;
}
const UTMS = collectUtms();

// Monta a URL de venda repassando UTMs + fbclid (rastreio da jornada até o Systeme)
function salesUrlWithParams(){
  try{
    const u = new URL(CONFIG.salesUrl);
    Object.entries(UTMS).forEach(([k,v]) => u.searchParams.set(k, v));
    return u.toString();
  }catch(e){ return CONFIG.salesUrl; }
}

// Pixel + eventos
function initPixel(){
  if(CONFIG.pixelId && typeof fbq === "undefined"){
    /* eslint-disable */
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    /* eslint-enable */
    fbq('init', CONFIG.pixelId);
    fbq('track', 'PageView');
  }
}
function track(event, params={}, standard=false){
  try{
    if(typeof fbq === "function"){
      fbq(standard ? 'track' : 'trackCustom', event, params);
    }
  }catch(e){}
  // eco no console pra você validar durante o setup
  console.log("[track]", event, params);
}

/* ---- Cálculo do perfil ---- */
function computeProfile(){
  let score = 0, maxScore = 0;
  QUESTIONS.forEach(qq=>{
    const a = state.answers[qq.id];
    maxScore += 4 * qq.weight;
    if(a) score += a.level * qq.weight;
  });
  // faixas ~ terços do intervalo possível (8..32)
  if(score <= 15) return PROFILES.iniciante;
  if(score <= 23) return PROFILES.inconsistente;
  return PROFILES.evolucao;
}

/* ---- Sparkline de progresso (o "gráfico" que sobe conforme responde) ---- */
function renderSpark(){
  const answered = Math.max(0, state.step === -1 ? 0 : Object.keys(state.answers).length);
  const n = TOTAL;
  const W = 170, H = 34, pad = 3;
  const xs = i => pad + (W - pad*2) * (i/(n-1));
  // linha base "de mercado" leve
  const levels = QUESTIONS.map(q => state.answers[q.id]?.level ?? null);
  // pontos: usa o nível respondido; onde não respondeu, mantém sobe suave
  let lastY = H - 6;
  const pts = [];
  for(let i=0;i<n;i++){
    let y;
    if(levels[i]!=null){ y = H - 4 - ((levels[i]-1)/3)*(H-10); lastY = y; }
    else { y = lastY; }
    pts.push([xs(i), y]);
  }
  const track = document.getElementById("sparkTrack");
  const line = document.getElementById("sparkLine");
  const dotsG = document.getElementById("sparkDots");
  track.setAttribute("points", pts.map(p=>`${p[0].toFixed(1)},${(H-8).toFixed(1)}`).join(" "));
  // linha só até onde respondeu
  const drawn = pts.slice(0, Math.max(1, answered));
  line.setAttribute("points", drawn.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" "));
  // anima o traço
  line.style.setProperty("--dash", answered ? "0" : "1000");
  dotsG.innerHTML = "";
  for(let i=0;i<n;i++){
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", pts[i][0].toFixed(1));
    c.setAttribute("cy", pts[i][1].toFixed(1));
    c.setAttribute("r", "2.6");
    c.setAttribute("class", "dot" + (i < answered ? " on" : ""));
    dotsG.appendChild(c);
  }
}

function setStepLabel(txt){ document.getElementById("stepLabel").textContent = txt; }

/* ============================================================
   Telas
   ============================================================ */
function renderIntro(){
  setStepLabel("60 segundos");
  app.innerHTML = `
    <div class="card fade">
      <h1>Que tipo de trader é você?</h1>
      <p class="lead">Responda 6 perguntas rápidas e receba uma leitura do seu momento no mercado — e o próximo passo certo pra sua evolução.</p>
      <div style="margin-top:24px">
        <button class="btn" id="start">Começar o diagnóstico</button>
      </div>
    </div>`;
  document.getElementById("start").onclick = ()=>{
    track("QuizStart", { total_steps: TOTAL });
    state.step = 0; render();
  };
  renderSpark();
}

function renderQuestion(i){
  const qq = QUESTIONS[i];
  setStepLabel(`${i+1} / ${TOTAL}`);
  app.innerHTML = `
    <div class="card fade">
      <div class="qmeta">Pergunta ${i+1} de ${TOTAL}</div>
      <h2>${qq.q}</h2>
      <div class="opts" role="group" aria-label="${qq.q}">
        ${qq.opts.map((o,idx)=>`
          <button class="opt" data-idx="${idx}">
            <span class="k">${o.k}</span>
            <span>${o.t}</span>
          </button>`).join("")}
      </div>
      ${i>0 ? `<button class="back" id="back">← Voltar</button>` : ``}
    </div>`;
  app.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      const o = qq.opts[+btn.dataset.idx];
      state.answers[qq.id] = { k:o.k, t:o.t, level:o.level };
      track("QuizStep", { step:i+1, question:qq.id, answer:o.k, value:o.level });
      renderSpark();
      if(i+1 < TOTAL){ state.step = i+1; render(); }
      else { state.step = "capture"; render(); }
    };
  });
  const back = document.getElementById("back");
  if(back) back.onclick = ()=>{ state.step = i-1; render(); };
  renderSpark();
}

function renderCapture(){
  setStepLabel("último passo");
  app.innerHTML = `
    <div class="card fade">
      <div class="qmeta">Seu resultado está pronto</div>
      <h2>Pra onde enviamos a sua leitura?</h2>
      <p class="lead">Deixe seu contato pra ver o seu perfil e receber o próximo passo por e-mail e WhatsApp.</p>
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" placeholder="Seu nome" />
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="voce@email.com" />
      </div>
      <div class="field">
        <label for="zap">WhatsApp</label>
        <input id="zap" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 90000-0000" />
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="submit"><span>Ver meu perfil de trader</span></button>
      <button class="back" id="back">← Voltar</button>
      <p class="consent">Ao continuar, você concorda em receber contato da BitVisionário. Nada de spam.</p>
    </div>`;

  const nome  = document.getElementById("nome");
  const email = document.getElementById("email");
  const zap   = document.getElementById("zap");
  const err   = document.getElementById("err");
  const btn   = document.getElementById("submit");

  // máscara simples de telefone BR
  zap.addEventListener("input", ()=>{
    let v = zap.value.replace(/\D/g,"").slice(0,11);
    if(v.length>=1) v = "("+v;
    if(v.length>=3) v = v.slice(0,3)+") "+v.slice(3);
    if(v.length>=10) v = v.slice(0,10)+"-"+v.slice(10);
    zap.value = v;
  });

  document.getElementById("back").onclick = ()=>{ state.step = TOTAL-1; render(); };

  btn.onclick = async ()=>{
    const nomeV = nome.value.trim();
    const emailV = email.value.trim();
    const zapDigits = zap.value.replace(/\D/g,"");
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailV);

    if(nomeV.length < 2){ err.textContent = "Digite seu nome."; nome.focus(); return; }
    if(!emailOk){ err.textContent = "Digite um e-mail válido."; email.focus(); return; }
    if(zapDigits.length < 10){ err.textContent = "Digite um WhatsApp válido com DDD."; zap.focus(); return; }
    err.textContent = "";
    btn.disabled = true;
    btn.innerHTML = `<span class="spin"></span>`;

    const profile = computeProfile();
    const payload = {
      nome: nomeV,
      email: emailV,
      whatsapp: zapDigits,
      perfil: profile.key,
      perfil_nome: profile.badge,
      respostas: state.answers,
      ...UTMS,
      pagina: location.href,
      criado_em: new Date().toISOString(),
    };

    await saveLead(payload);

    // eventos de conversão
    track("Lead", { content_name:"quiz_trader", perfil:profile.key }, true);
    track("QuizResult", { perfil:profile.key });

    state.result = profile;
    state.step = "result";
    render();
  };
  renderSpark();
}

async function saveLead(payload){
  const jobs = [];

  // Supabase
  if(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey && window.supabase){
    try{
      const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
      jobs.push(sb.from(CONFIG.supabaseTable).insert(payload));
    }catch(e){ console.warn("Supabase indisponível:", e); }
  }
  // Webhook
  if(CONFIG.webhookUrl){
    jobs.push(fetch(CONFIG.webhookUrl, {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    }).catch(e=>console.warn("Webhook falhou:", e)));
  }

  if(jobs.length){
    try{ await Promise.allSettled(jobs); }catch(e){}
  } else {
    console.log("[lead] nenhum destino configurado — payload:", payload);
  }
}

function renderResult(){
  const p = state.result || computeProfile();
  setStepLabel("resultado");
  app.innerHTML = `
    <div class="card fade">
      <span class="badge">● ${p.badge}</span>
      <h2>${p.title}</h2>
      <p class="result-body">${p.body}</p>
      <ul class="traits">
        ${p.traits.map(t=>`<li><span class="tick">✓</span><span>${t}</span></li>`).join("")}
      </ul>
      <div class="divider"></div>
      <a class="btn" id="cta" href="${salesUrlWithParams()}" target="_blank" rel="noopener">${p.cta}</a>
    </div>`;
  document.getElementById("cta").onclick = ()=>{
    track("CTAClick", { perfil:p.key, destino:"pagina_de_venda" });
  };
  renderSpark();
}

/* ---- Roteador ---- */
function render(){
  if(state.step === -1) return renderIntro();
  if(state.step === "capture") return renderCapture();
  if(state.step === "result") return renderResult();
  return renderQuestion(state.step);
}

/* ---- Boot ---- */
initPixel();
render();
</script>
</body>
</html>
